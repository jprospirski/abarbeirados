spring.application.name=abarbeirados

# Banco H2 em memoria com nome fixo. Sem isto o Spring gera um nome aleatorio a cada boot e o console (ou o DBeaver) nunca acha a base.
spring.datasource.url=jdbc:h2:mem:abarbeirados
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# O dono do schema agora e o Flyway (db/migration). O Hibernate so valida que as
# entidades batem com as tabelas criadas pelas migrations — se divergirem, o boot
# falha na hora em vez de alterar a tabela por conta propria.
spring.jpa.hibernate.ddl-auto=validate
# Desligado de proposito: com ele ligado o Hibernate mantem a sessao aberta ate a renderizacao da resposta, o que esconde erro de lazy loading em desenvolvimento.
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Explicito porque V2 tem acento ("Química") e o nome do servico precisa bater
# exatamente com o que o frontend procura.
spring.flyway.encoding=UTF-8

springdoc.swagger-ui.path=/swagger-ui.html
