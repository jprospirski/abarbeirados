spring.application.name=abarbeirados

# Banco PostgreSQL. Crie o banco antes de subir: CREATE DATABASE abarbeirados;
# Credenciais e segredos vem de variaveis de ambiente, nunca deste arquivo.
# A senha do banco (DB_PASSWORD) nao tem valor padrao: sem ela a aplicacao nao
# sobe. Em producao defina tambem DB_URL e DB_USERNAME.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/abarbeirados}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# O dono do schema agora e o Flyway (db/migration). O Hibernate so valida que as
# entidades batem com as tabelas criadas pelas migrations — se divergirem, o boot
# falha na hora em vez de alterar a tabela por conta propria.
spring.jpa.hibernate.ddl-auto=validate
# Desligado de proposito: com ele ligado o Hibernate mantem a sessao aberta ate a renderizacao da resposta, o que esconde erro de lazy loading em desenvolvimento.
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Explicito porque V2 tem acento ("Química") e o nome do servico precisa bater
# exatamente com o que o frontend procura.
spring.flyway.encoding=UTF-8

springdoc.swagger-ui.path=/swagger-ui.html
