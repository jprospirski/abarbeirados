spring.application.name=abarbeirados

# Banco H2 em memoria com nome fixo. Sem isto o Spring gera um nome aleatorio a
# cada boot e o console (ou o DBeaver) nunca acha a base.
spring.datasource.url=jdbc:h2:mem:abarbeirados
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2: http://localhost:8080/h2-console
# Na tela de login use a JDBC URL acima, usuario "sa" e senha em branco.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
# Desligado de proposito: com ele ligado o Hibernate mantem a sessao aberta ate a
# renderizacao da resposta, o que esconde erro de lazy loading em desenvolvimento.
spring.jpa.open-in-view=false
