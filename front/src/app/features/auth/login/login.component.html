<div class="entrar">
  <form class="entrar__painel painel" (ngSubmit)="logar()">
    <div class="bloco">
      <p class="rotulo">Acesso</p>
      <h1 class="entrar__titulo">Entrar</h1>
      <p class="entrar__legenda">Use as credenciais da barbearia para continuar.</p>

      <mdb-form-control class="entrar__campo">
        <input
          mdbInput
          type="text"
          id="usuario"
          name="username"
          class="form-control"
          [(ngModel)]="login.username"
          autocomplete="username"
        />
        <label mdbLabel class="form-label" for="usuario">Usuário</label>
      </mdb-form-control>

      <mdb-form-control class="entrar__campo">
        <input
          mdbInput
          type="password"
          id="senha"
          name="password"
          class="form-control"
          [(ngModel)]="login.password"
          autocomplete="current-password"
        />
        <label mdbLabel class="form-label" for="senha">Senha</label>
      </mdb-form-control>

      <button type="submit" class="botao-principal entrar__botao" [disabled]="entrando">
        {{ entrando ? 'Entrando...' : 'Entrar' }}
      </button>

      <p class="entrar__legenda entrar__troca">
        Ainda não tem acesso? <a routerLink="/cadastro">Criar usuário</a>
      </p>
    </div>
  </form>
</div>
