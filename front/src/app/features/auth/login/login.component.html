<div class="entrar">
  <form class="entrar__painel painel" [formGroup]="form" (ngSubmit)="entrar()">
    <div class="bloco">
      <p class="rotulo">Acesso</p>
      <h1 class="entrar__titulo">Entrar</h1>
      <p class="entrar__legenda">Use as credenciais da barbearia para continuar.</p>

      <mdb-form-control class="entrar__campo">
        <input
          mdbInput
          type="text"
          id="usuario"
          class="form-control"
          formControlName="usuario"
          autocomplete="username"
        />
        <label mdbLabel class="form-label" for="usuario">Usuário</label>
      </mdb-form-control>

      <mdb-form-control class="entrar__campo">
        <input
          mdbInput
          type="password"
          id="senha"
          class="form-control"
          formControlName="senha"
          autocomplete="current-password"
        />
        <label mdbLabel class="form-label" for="senha">Senha</label>
      </mdb-form-control>

      @if (erro()) {
        <p class="alerta alerta--erro" role="alert">{{ erro() }}</p>
      }

      <button
        type="submit"
        class="botao-principal entrar__botao"
        mdbRipple
        [disabled]="entrando()"
      >
        {{ entrando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </div>
  </form>
</div>
